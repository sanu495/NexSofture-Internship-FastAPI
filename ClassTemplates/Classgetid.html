<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Find</title>
</head>

<body>
    <div class="top">
        <img src="ClassPhotos/Logo-3.png" alt="">
    </div>
    <div class="body-container">
        <div class="form-container">
            <h2>Class Find</h2>
            <form action="/classfind" method="post">
                <div class="form-group">
                    <label for="class_id">Class ID</label>
                    <input type="text" id="class_id" name="class_id" pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[4][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}" maxlength="36" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    img {
        width: 220px;
        height: auto;
        filter: brightness(0) invert(1);

    }

    .body-container {
        background-image: url("ClassPhotos/office_characters_05.jpg");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
    }

    body {
        background: radial-gradient(circle at 10% 20%, rgba(209, 192, 192, 0.15) 0, transparent 40%),
            radial-gradient(circle at 80% 0, rgba(185, 172, 172, 0.08) 0, transparent 50%),
            #372561;
        min-height: 100vh;
        padding: 12px;
    }

    .body-container {
        width: 950px;
        padding-top: 120px;
        padding-left: 430px;
        height: 510px;
        border-radius: 55px;
        margin-left: 17%;
        box-shadow: 0 8px 20px rgba(18, 18, 19, 0.623);
        cursor: pointer;

    }

    .body-container:hover {
        box-shadow: 0 8px 20px rgba(80, 178, 235, 0.952);

    }

    .form-container {
        background: linear-gradient(135deg, #f6faf7, #f6faf7);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(15, 14, 14, 0.89);
        width: 100%;
        max-width: 360px;
    }

    h2 {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-align: center;
        color: #0e0d0d;
        margin-bottom: 22px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.8px;
        position: relative;
    }

    .form-group {
        margin-bottom: 10px;
        position: relative;
    }

    label {
        display: block;
        margin-bottom: 6.4px;
        color: #0a0909;
        font-weight: 600;
        font-size: 15px;
        transition: color 0.3s ease;
    }

    input,
    select {
        width: 100%;
        height: 40px;
        padding: 0 16px;
        border: 1.6px solid #e1e5e9;
        border-radius: 10px;
        font-size: 12.8px;
        background: #f8f9fa;
        font-family: inherit;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #20ac66;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);

    }

    select {
        cursor: pointer;
        padding-right: 32px;
    }

    .form-buttons {
        display: flex;
        gap: 20px;
        margin-top: 22px;
    }

    button {
        flex: 1;
        height: 40px;
        border: none;
        border-radius: 10px;
        font-size: 12.6px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        box-shadow: 0 8px 20px rgba(90, 211, 90, 0.623);
    }

    .btn-submit {
        background: linear-gradient(135deg, #603599 0%, #1db13d 100%);
        color: rgb(7, 6, 6);
        border-color: #147c14;

    }

    .btn-submit:hover {
        transform: translateY(-1.6px);
        box-shadow: 0 8px 20px rgba(18, 19, 19, 0.623);
    }

    .btn-reset {
        background: linear-gradient(135deg, #603599 0%, #1db13d 100%);
        color: rgb(7, 6, 6);
        border: 1.6px;
    }

    .btn-reset:hover {
        transform: translateY(-1.6px);
        box-shadow: 0 8px 20px rgba(18, 18, 19, 0.623);
    }
</style>

</html>
