<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Submit data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Pacifico&family=Rubik+Gemstones&display=swap"

<body>
  <div class="top">
    <div class="img">
      <img src="ClassPhotos/Logo-3.png" alt="">
  </div>
    <div class="section">
      <ul>
        <li><a href="{{url_for('class_home')}}">Home</a></li>
        <li><a href="{{url_for('class_form')}}">Create</a></li>
        <li><a href="{{url_for('class_update')}}">Update</a></li>
        <li><a href="{{url_for('class_find')}}">Find</a></li>
        <li><a href="{{url_for('class_delete')}}">Delete</a></li>
        <li><a href="{{url_for('class_details')}}">Details</a></li>
   
      </ul>
    </div>
  </div>
  <div class="main">

    <div class="head">
      <h1 class="h1">Class data</h1>
    </div>
    <div class="body-container">
      <table>

        <tr>
          <td class="one">ID</td>
          <td class="two">{{submit.id}}</td>
        </tr>
        <tr>
        <tr>
          <td class="one">CLASS</td>
          <td class="two">{{submit.class_name}}</td>
        </tr>
        <tr>
          <td class="one">CLASS TEACHER</td>
          <td class="two">{{submit.class_teacher}}</td>
        </tr>
        <tr>
          <td class="one">CREATED TIME</td>
          <td class="two">{{submit.created_at}}</td>
        </tr>
      </table>
    </div>
  </div>
  <div class="social-icons">
    <div class="end">
      <div class="img2">
        <img src="ClassPhotos/Logo-3.png" alt="">
    </div>
    <div class="end2">
      <div class="follow">
        <h4>Follow On</h4>
      </div>
      <div class="instagram">
        <a href="www.instagram.com"><i id="icon" class="fab fa-instagram"></i></a>
      </div>
      <div class="facebook">
        <a href="www.facebook.com"><i id="icon" class="fab fa-facebook-f"></i></a>
      </div>
      <div class="twitter">
        <a href="www.twitter.com"><i id="icon" class="fab fa-twitter"></i></a>
      </div>
    </div>
  </div>
</div>
</body>
