<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>
    <link rel="icon" type="image/png" href="Photos/owl logo 2.jpg">
</head>

<body>
    <div class="top">
        <img src="Photos/Logo-3.png" alt="">
    </div>
    <div class="body-container">
        <div class="form-container">
            <h2>🎓 Student Registration</h2>
            <form action="/submit" method="post">
                <input type="hidden" name="id">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label for="bloodgroup">Blood Group</label>
                    <select id="bloodgroup" name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="B+">B Positive</option>
                        <option value="B-">B Negative</option>
                        <option value="A+">A Positive</option>
                        <option value="AB+">AB Positive</option>
                        <option value="O+">O Positive</option>
                        <option value="O-">O Negative</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="classStd">Class Standard</label>
                    <input type="number" id="classStd" name="class_Std" min="1" max="12" required>
                </div>

                <div class="form-group">
                    <label for="primary_contact_number">Contact Number</label>
                    <input type="tel" id="phone" name="primary_contact_number" required>
                </div>
                <input type="hidden" name="created_at">
                <input type="hidden" name="updated_at">

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
<style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    
    body {
        background:  radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.15) 0, transparent 40%),
            radial-gradient(circle at 80% 0, rgba(255, 255, 255, 0.08) 0, transparent 50%),
            #050816;

    }

    .body-container {
        background-image: url("Photos/Cosmic\ astronaut\ cradles\ neon\ galaxy\ dust\ in\ deep\ space.\ 3840×2160.jpg");
        background-repeat: no-repeat;
        background-position: -180px;
        background-size: contain;
        background-attachment: fixed;
        background-color: black;
        transform: translateY(-1.6px);


    }

    .body-container {
        position: relative;
        bottom: px;
        width: 950px;
        height: 510px;
        border-radius: 55px;
        margin-left: 17%;
        box-shadow: 0 8px 20px rgba(18, 18, 19, 0.623);
        cursor: pointer;

    }

    .body-container:hover {
        box-shadow: 0 8px 20px rgba(80, 178, 235, 0.952);

    }

        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        flex-direction: column;

    .form-container {
        margin-left: 58%;
        margin-top: 18px;

        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.1);

    }

    h2 {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-align: center;

        margin-bottom: 13px;

    }

    .form-group {
        margin-bottom: 3px;
