<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Subject Management Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="nav">
        <div class="logo">
            <img src="SubPhotos/Logo-3.png" alt="">
        </div>
        <nav class="nav-links">
            <a href="{{url_for('home')}}">Home</a>
            <a href="{{url_for('student_details')}}">Students</a>
            <a href="{{url_for('class_details')}}">Classes</a>
            <a href="{{url_for('about_us')}}">About US</a>
        </nav>
        <button class="nav-cta">Sign Up</button>
    </header>

    <main class="hero">
        <section class="hero-text">
            <h1>Smart <span>Subject</span> Management</h1>
            <p>Manage students, classes, and teachers in one modern dashboard with real‑time updates.</p>
            <div class="hero-actions">
                <a href="{{url_for('subject_form')}}" class="btn primary">Get Started</a>
                <a href="{{url_for('subject_details')}}" class="btn ghost">View Subjects</a>
            </div>
            <div class="social">
                <span>Follow us</span>
                <a href="www.instagram.com"><i id="icon" class="fab fa-instagram"></i></a>
                <a href="www.facebook.com"><i id="icon" class="fab fa-facebook-f"></i></a>
                <a href="www.twitter.com"><i id="icon" class="fab fa-twitter"></i></a>
            </div>
        </section>

        <aside class="hero-panel">
            <h2>Quick Actions</h2>
            <ul>
                <li class="btn full"><a href="{{url_for('subject_form')}}">Create Subject</a></li>
                <li class="btn full"><a href="{{url_for('subject_update')}}">Subject Update</a></li>
                <li class="btn full"><a href="{{url_for('subject_find')}}">Subject Find</a></li>
                <li class="btn full"><a href="{{url_for('subject_delete')}}">Subject Delete</a></li>
                <li class="btn full"><a href="{{url_for('subject_details')}}">Subjects Details</a></li>
            </ul>

        </aside>
    </main>
</body>
<style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {

        color: #0f172a;
        min-height: 100vh;
        background-image: url("SubPhotos/nice\ plant\ new.jpg");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
    }

    img {
        width: 180px;
        height: auto;
        filter: brightness(0) invert(1);

    }

    a {
        text-decoration: none;
        color: #232425;
    }

    /* Top navigation */
    .nav {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.2rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #e5e7eb;
    }

    .logo {
        font-weight: 700;
        letter-spacing: 2px;
    }

    .nav-links a {
        margin: 0 0.75rem;
        padding: 18px;
        text-decoration: none;
        font-size: 0.9rem;
        color: #cbd5f5;
    }

    .nav-links a:hover {
        color: #28272b;
        padding: 10px 18px;
        background-color: #9de0f5;
        transform: translateY(-3.6px);
        box-shadow: 0 14px 30px rgba(169, 234, 250, 0.932);
        border-radius: 50px;


    }

    .nav-cta {
        padding: 0.5rem 1.1rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        color: #0f172a;
        background: linear-gradient(135deg, #22c55e, #a855f7);
    }

        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 1.5rem 4rem;

        justify-content: space-between;
        color: #e5e7eb;
    }

        flex: 1.3;

        font-size: 3rem;

    }

        background: linear-gradient(135deg, #22c55e, #a855f7);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    }

    }

        background: rgba(87, 97, 121, 0.7);
    }

    .btn.full {

        border-radius: 999px;
        padding: 0.85rem 1.2rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: #3c3e41;
        background: linear-gradient(135deg, #c3c8ca, #c1c6c9);

    }

        margin-bottom: 1.8rem;
    }

    .social {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.85rem;
        color: #bac2cf;
    }

    .social a {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.7);

        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #e5e7eb;

    }

    }

    .hero-panel {

        padding: 1.8rem 1.8rem 2rem;

        font-size: 1.2rem;
